<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- NES.css -->
    <link rel="stylesheet" href="https://unpkg.com/nes.css@latest/css/nes.min.css">

    <!-- 自分のCSS -->
    <link rel="stylesheet" href="style.css">

    <title>NES.css Test</title>
</head>
<body>

    <div class="container">
        <h1 class="nes-text is-primary">
            NES.css テスト
        </h1>

        <button class="nes-btn is-primary">
            ボタン
        </button>

        <button class="nes-btn is-success">
            再生
        </button>

        <button class="nes-btn is-error">
            停止
        </button>

        <section class="nes-container with-title">
            <p class="title">サンプル</p>
            <p>これはテストです</p>
        </section>
    </div>

</body>
</html>
